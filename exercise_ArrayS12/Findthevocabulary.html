<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Document</title>
</head>
<body>
	<h1>app dich tung vung</h1>
	<input type="text" id = "nhap" style="width: 200px;height: 20px;">
	<button onclick="translation()" id = "timkiem"  style="width: 200px;height: 20px;"></button>
	<p><span id = "hienthi"></span></p>
</body>
<script>
	function translation(){
		var x = ["Good","Bad","Handsome"];
		var y = ["Tot","Te","Dep trai"];
		var timkiem = document.getElementById("nhap").value;
		var invalue = document.getElementById("hienthi");
		if(timkiem==x[0]){
			invalue.innerHTML = y[0];
		}
		else if(timkiem==x[1]){
			invalue.innerHTML = y[1];
		}
		else if(timkiem==x[2]){
			invalue.innerHTML = y[2];
		}
		else {
			invalue.innerHTML = "khong tim ra ";
		}
	}
</script>
</html>
