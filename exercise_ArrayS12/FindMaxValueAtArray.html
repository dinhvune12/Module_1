<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Document</title>
</head>
<body>
	<button id = "timso" onclick="main()">tim</button>
	<p>so lon nhat la <span id ="input"></span></p>
	
</body>
<script>
	var arr = [];
	function dauvao(){
		arr = [];
		var max = -1e9;
		var n = Number(prompt("nhap so luong muon nhap"));
		for(var i = 0; i < n;i++){
			var nhap = Number(prompt("nhap so de a["+ i+"] = "))
			arr[i] = Number(nhap);

		}
	}
	function solonnhat(){
		var max = -1e9;
		for(var i = 0; i < arr.length;i++){
			if(arr[i] > max) max = arr[i]; 
		} 	
		return max ;
	}
	function main(){
		dauvao();
		
		document.getElementById("input").innerHTML = solonnhat();
	}
</script>
</html>
