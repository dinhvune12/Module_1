<script>
	var mang = [];
		function nhapmang(){
			for(var i = 0; i < 10;i++){
				mang[i] = Math.floor(Math.random() * 100);
			}
		}
		function kiemtrasomax(){
			var max = -Infinity;
			var index  = -1;
			for(var i = 0; i < 10;i++){
				if(mang[i] > max) max = mang[i];
				index = i;
			}
			
			return {max:max,index:index};
		}
		function inmang(){
			for(var i = 0; i < 10;i++){
				document.writeln(mang[i]);
			}
			var lon = kiemtrasomax();
			document.writeln("<br> so llon nhat la " + lon.max +"o vi tri thu "+ lon.index);
		}
		nhapmang();
		inmang();
</script>
</html>
