<script>
	var mang = [];
		function nhapmang(){
			for(var i = 0; i < 10;i++){
				mang[i] = Math.floor(Math.random() * 201) -100;
			}
		}
		function kiemtrasomax(){
			var count = 0;
			for(var i = 0; i < 10;i++){
				if(mang[i] < 0) 
				count++;
			}
			
			return count;
		}
		function inmang(){
			for(var i = 0; i < 10;i++){
				document.writeln(mang[i]);
			}
			var lon = kiemtrasomax();
			document.writeln("<br> dem so am " + lon);
		}
		nhapmang();
		inmang();
</script>
</html>
