<!DOCTYPE html>

<script>
	var mang = [];
		function nhapmang(){
			for(var i = 0; i < 10;i++){
				mang[i] = Math.floor(Math.random() * 100);
			}
		}
		function daonguocmang(){
			
			for(var i = 0; i < mang.length / 2;i++){
				var temp = mang[i];
				mang[i] = mang[mang.length-1 -i];
				mang[mang.length-1-i] = temp;
			}
			
		}
		function inmang(){
			for(var i = 0; i < 10;i++){
				document.writeln(mang[i]);
			}
			
			
		}
		
		nhapmang();
		inmang();
		daonguocmang();
		document.writeln("mang sau khi dao la ");
		inmang();
</script>
</html>
