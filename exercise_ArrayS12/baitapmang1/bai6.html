<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Document</title>
</head>
<body>
	
</body>
<script>
	var mang = [];
		function nhapmang(){
			for(var i = 0; i < 10;i++){
				mang[i] = Math.floor(Math.random() * 100);
			}
		}
		function kiemtrasomax(){
			var find = prompt("nhap so ban muon tim");
			if(mang.includes(find) == true){
				return "V is in the array";
			}
			else{
				return "V is not in the array";
			}

			
		}
		function inmang(){
			for(var i = 0; i < 10;i++){
				document.writeln(mang[i]);
			}
			var lon = kiemtrasomax();
			document.writeln(lon);
		}
		nhapmang();
		inmang();
</script>
</html>
