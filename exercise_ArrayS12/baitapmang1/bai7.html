<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Document</title>
</head>
<body>
	
</body>
<script>
	var mang = [];
		function nhapmang(){
			for(var i = 0; i < 10;i++){
				mang[i] = Math.floor(Math.random() * 100);
			}
		}
		function kiemtrasomax(){
			var j = 0;
			var xacnhan= false;
		var x = parseInt(prompt("nhap so muon xoa"));
		for(var i = 0; i < mang.length;i++){
			if(mang[i] !== x){
				mang[j] = mang[i];
				j++;
			}
			else{
				xacnhan = true;
			}
			
				
		}
		mang.length = j;
		if(xacnhan){
			 document.writeln("<br>da xoa tat car so" + x + " khoi mang <br>");
		}
			 else {
        document.writeln("<br>khong co so " + x + " trong mang.<br>");
      }
		}
		function inmang(){
			for(var i = 0; i < mang.length;i++){
				document.writeln(mang[i]);
			}
			
			
		}
		nhapmang();
		inmang();

		kiemtrasomax();
		document.writeln("mang sau khi xoa");
		inmang();
</script>
</html>
