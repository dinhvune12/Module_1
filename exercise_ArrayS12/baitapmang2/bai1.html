<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Document</title>
</head>
<body>
	<p> <span id = "inmang"></span></p>
</body>
<script>
	let a = [
    [1, 2, 1, 24],
    [8, 11, 9, 4],
    [7, 0, 7, 27],
    [7, 4, 28, 14],
    [3, 10, 26, 7]
];
	function inmang(){
		var inmang = document.getElementById("inmang");
		var x = "";
		for(var j = 0; j <a.length-1;j++){
			x += "row" + j + "<br>";
			for(var i = 0; i < a.length-1;i++){
				x+= " " + a[j][i]+ "<br>";
			}
		}
		inmang.innerHTML = x;
	}
	inmang();
</script>
</html>
