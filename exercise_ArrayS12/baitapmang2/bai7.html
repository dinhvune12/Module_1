<script>
	var a=[];
	function nhap(){
		var n =prompt("nhap so luong ky tu trong mang");
		
		for(var i = 0; i < n;i++){
			a[i] = prompt("nhap phan tu thu " + (i+1));
		}
	}
	function check(){
		var i;
		var x = ""
		for(i = 0;i <a.length;i++){
			if(a[i] === '-'){
				a[i] = '_';
			}
			x += a[i];
		}
		alert(x);
	}
	nhap();
	check();
</script>
