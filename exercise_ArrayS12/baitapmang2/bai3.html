<script>
	var a=[];
	function nhap(){
		var n =prompt("nhap so luong ky tu trong mang");
		
		for(var i = 0; i < n;i++){
			a[i] = prompt("nhap phan tu thu " + (i+1));
		}
	}
	function check(){
		var i;
		var count = 0;
		for(i = 0;i <a.length;i++){
			if(!isNaN(a[i]) && a[i] !== " "){
				count++;
			}
		}
		alert("co tong ki tu so la "+ count);
	}
	nhap();
	check();
</script>
