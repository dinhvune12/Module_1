<script>
	class nhietdo{
		constructor(nhietdo){
			this.nhietdo = nhietdo;
		}
		get F(){
			return 9/5 * this.nhietdo + 32;
		}
		get K(){
			return this.nhietdo + 273.15;
		}
	}
	var nhietdone = Number(prompt("nhap nhiet do muon chuyen doi"));
	var x = new nhietdo(nhietdone);
	document.writeln(x.F);
	document.writeln(x.K);
</script>
