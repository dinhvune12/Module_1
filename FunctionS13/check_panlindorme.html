<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Document</title>
</head>
<body>
	<input type="text" id="input" placeholder="Enter a string">
	<button onclick="main()">Check Palindrome</button>
	
	<p id="result"></p>
</body>
<script>
		var str = [];
	function checkPalindrome(str, l,r){
	
		
		if(l >=r)	 return true;
		if(str[l] != str[r]) return false;
		return checkPalindrome(str, l+1, r-1);
	}
	function main(){
		var str = document.getElementById("input").value;
		
		if(checkPalindrome(str, 0, str.length -1)){
			document.getElementById("result").innerHTML = `"${str}" is a palindrome.`;
		}else{
			document.getElementById("result").innerHTML = `"${str}" is not a palindrome.`;
		}
		document.getElementById("input").value = "";
	}
</script>
</html>
