<script>
	function checksonguyento(number){
		if( number < 2 ){
			return 0;
		}
		for(var i = 2; i <= Math.sqrt(number);i++){
			if(number % i == 0){
				return 0;
			}
		}
		return 1;
	}
	function kiemtra(){
		var x ;
		do{
		 x = Number(prompt("nhap so di (0 de thoat vong lap)"));
		if(checksonguyento(x)){
			alert("day la so nguyen to");
		}
		else{
			alert("khong phai so nguyen to ");
		}
	}while(x !== 0);
	}
	kiemtra();
</script>
