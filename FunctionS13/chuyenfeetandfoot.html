<script>
	function footToMeter(n){
		var x = n * 3.729;
		document.write(x+ "<br>");
	}
	function meterToFoot(number){
		var tong = number * 0.305;
		document.write(tong+ "<br>");
	}
	var feet = Number(prompt("nhap feet"));
	var meter = Number(prompt("nhap meter"));
	footToMeter(feet);
	meterToFoot(meter);
</script>
