<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Document</title>
</head>
<body>
	<script>
		function giaithua(){
			var n = Number(prompt("Nhap so can tinh giai thua:"));
			if(isNaN(n) || n < 0 || !Number.isInteger(n)){
				return "Vui long nhap so nguyen duong";
			}
			var giaiThua = 1;
			for(var i = 1; i <= n; i++){
				giaiThua *= i;
			}
			return giaiThua;
		}
		giaithua();
	</script>
</body>
</html>
