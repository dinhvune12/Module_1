<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Document</title>
</head>
<body>
	<script>
		function binhphuong(x){
			if(isNaN(x)){
				return "Vui long nhap so";
			}
			return Math.pow(x,2);
		}
		function main(){
			var so = Number(prompt("nhap so can tinh binh phuong:"));
			var ketqua = binhphuong(so);
			document.write("Binh phuong cua " + so + " la: " + ketqua);
		}
		main();
	</script>
</body>
</html>
