<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quản lý sinh viên Modern UI</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap"
      rel="stylesheet"
    />

    <style>
      /* --- Cài đặt chung --- */
      :root {
        --primary-color: #6a11cb;
        --secondary-color: #2575fc;
        --accent-color: #ff4b1f;
        --text-color: #333;
        --white: #ffffff;
        --glass-bg: rgba(255, 255, 255, 0.85);
        --shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Poppins", sans-serif;
        background: linear-gradient(
          135deg,
          var(--primary-color) 0%,
          var(--secondary-color) 100%
        );
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center; /* Căn giữa màn hình */
        padding: 20px;
        color: var(--text-color);
      }

      /* --- Khung chứa chính (Hiệu ứng kính) --- */
      .container {
        width: 100%;
        max-width: 1000px;
        background: var(--glass-bg);
        backdrop-filter: blur(10px); /* Làm mờ nền phía sau */
        -webkit-backdrop-filter: blur(10px);
        border-radius: 24px;
        padding: 40px;
        box-shadow: var(--shadow);
        border: 1px solid rgba(255, 255, 255, 0.18);
        transition: transform 0.3s ease;
      }

      h2 {
        text-align: center;
        background: linear-gradient(
          to right,
          var(--primary-color),
          var(--secondary-color)
        );
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        font-size: 2.5em;
        margin-bottom: 40px;
        font-weight: 700;
        letter-spacing: 1px;
      }

      /* --- Menu chức năng --- */
      .menu {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 20px;
        list-style: none;
        margin-bottom: 40px;
      }

      /* --- Nút bấm --- */
      button {
        width: 100%;
        padding: 15px;
        font-family: "Poppins", sans-serif;
        font-size: 15px;
        font-weight: 600;
        border: none;
        border-radius: 12px;
        cursor: pointer;
        background: var(--white);
        color: var(--primary-color);
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        border: 2px solid transparent;
      }

      button:hover {
        transform: translateY(-5px);
        box-shadow: 0 10px 20px rgba(0, 0, 0, 0.15);
        background: linear-gradient(
          135deg,
          var(--primary-color),
          var(--secondary-color)
        );
        color: var(--white);
      }

      button:active {
        transform: translateY(-2px);
      }

      /* Nút thoát đặc biệt hơn một chút */
      .menu li:last-child button:hover {
        background: linear-gradient(135deg, #ff416c, #ff4b1f);
      }

      /* --- Khu vực hiển thị kết quả --- */
      #output {
        margin-top: 20px;
        animation: slideUp 0.5s ease-out;
      }

      @keyframes slideUp {
        from {
          opacity: 0;
          transform: translateY(20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      /* --- Bảng dữ liệu --- */
      table {
        width: 100%;
        border-collapse: collapse;
        background: var(--white);
        border-radius: 16px;
        overflow: hidden; /* Để bo góc hoạt động */
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.05);
      }

      th {
        background: linear-gradient(
          90deg,
          var(--primary-color),
          var(--secondary-color)
        );
        color: var(--white);
        padding: 18px;
        font-weight: 600;
        text-transform: uppercase;
        font-size: 14px;
        letter-spacing: 0.5px;
      }

      td {
        padding: 16px;
        text-align: center;
        border-bottom: 1px solid #f0f0f0;
        color: #555;
      }

      tr:last-child td {
        border-bottom: none;
      }

      tr:hover {
        background-color: #f8f9fa;
        transform: scale(1.01); /* Hiệu ứng nổi nhẹ khi di chuột vào hàng */
        transition: all 0.2s ease;
      }

      /* --- Thông báo --- */
      .empty-message {
        text-align: center;
        padding: 40px;
        color: #888;
        background: rgba(255, 255, 255, 0.5);
        border-radius: 12px;
        border: 2px dashed #ccc;
      }

      .exit-message {
        text-align: center;
        color: var(--white);
        font-size: 2em;
        font-weight: bold;
        text-shadow: 0 2px 10px rgba(0, 0, 0, 0.2);
      }

      /* --- Responsive Mobile --- */
      @media (max-width: 768px) {
        .container {
          padding: 20px;
        }

        h2 {
          font-size: 1.8em;
        }

        .menu {
          grid-template-columns: 1fr; /* 1 cột trên mobile */
        }

        th,
        td {
          padding: 12px 8px;
          font-size: 13px;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h2>📚 QUẢN LÝ SINH VIÊN</h2>

      <ul class="menu">
        <li><button onclick="searchStudent()">🔍 Tra cứu SV</button></li>
        <li><button onclick="addStudent()">➕ Thêm mới</button></li>
        <li><button onclick="deleteStudent()">🗑️ Xóa SV</button></li>
        <li><button onclick="showStudents()">👥 Xem tất cả</button></li>
        <li><button onclick="sortByScore()">📊 Xếp hạng điểm</button></li>
        <li><button onclick="checkScore()">✅ Tra điểm số</button></li>
        <li><button onclick="checkRank()">🎓 Tra học lực</button></li>
        <li><button onclick="exitProgram()">🚪 Thoát</button></li>
      </ul>

      <div id="output"></div>
    </div>

    <script>
      // Định nghĩa đối tượng Sinh viên
      function Student(id, name, age, className, score) {
        this.id = id;
        this.name = name;
        this.age = parseInt(age);
        this.className = className;
        this.score = parseFloat(score);

        this.rank = function () {
          if (this.score >= 8) return "Giỏi";
          if (this.score >= 6.5) return "Khá";
          if (this.score >= 5) return "Trung bình";
          return "Yếu";
        };
      }

      // Danh sách sinh viên
      var students = [];

      // ============ CHỨC NĂNG ============

      // 1. Thêm sinh viên
      function addStudent() {
        var id = prompt("Nhập mã sinh viên:");
        if (!id) return;

        var name = prompt("Nhập tên sinh viên:");
        if (!name) return;

        var age = prompt("Nhập tuổi:");
        if (!age) return;

        var className = prompt("Nhập lớp:");
        if (!className) return;

        var score = prompt("Nhập điểm:");
        if (!score) return;

        // Kiểm tra trùng mã sinh viên
        for (var i = 0; i < students.length; i++) {
          if (students[i].id === id) {
            alert("❌ Mã sinh viên đã tồn tại!");
            return;
          }
        }

        var sv = new Student(id, name, age, className, score);
        students.push(sv);
        alert("✅ Đã thêm sinh viên thành công!");
        // Tự động hiển thị lại danh sách sau khi thêm để người dùng thấy ngay
        showStudents();
      }

      // 2. Hiển thị danh sách
      function showStudents() {
        if (students.length === 0) {
          document.getElementById("output").innerHTML =
            "<div class='empty-message'>📋 Danh sách trống. Hãy thêm sinh viên mới!</div>";
          return;
        }

        var html =
          "<table><thead><tr><th>Mã SV</th><th>Họ tên</th><th>Tuổi</th><th>Lớp</th><th>Điểm</th><th>Học lực</th></tr></thead><tbody>";

        for (var i = 0; i < students.length; i++) {
          html += "<tr>";
          html += "<td><strong>" + students[i].id + "</strong></td>";
          html += "<td>" + students[i].name + "</td>";
          html += "<td>" + students[i].age + "</td>";
          html += "<td>" + students[i].className + "</td>";
          html += "<td>" + students[i].score + "</td>";

          // Thêm màu sắc cho học lực
          var rank = students[i].rank();
          var color =
            rank === "Giỏi"
              ? "#2ecc71"
              : rank === "Khá"
              ? "#3498db"
              : rank === "Yếu"
              ? "#e74c3c"
              : "#f1c40f";

          html +=
            "<td style='color: " +
            color +
            "; font-weight: bold;'>" +
            rank +
            "</td>";
          html += "</tr>";
        }

        html += "</tbody></table>";
        document.getElementById("output").innerHTML = html;
      }

      // 3. Tra cứu sinh viên
      function searchStudent() {
        var id = prompt("🔍 Nhập mã sinh viên cần tìm:");
        if (!id) return;

        for (var i = 0; i < students.length; i++) {
          if (students[i].id === id) {
            alert(
              "📝 THÔNG TIN SINH VIÊN\n\n" +
                "Tên: " +
                students[i].name +
                "\nTuổi: " +
                students[i].age +
                "\nLớp: " +
                students[i].className +
                "\nĐiểm: " +
                students[i].score +
                "\nHọc lực: " +
                students[i].rank()
            );
            return;
          }
        }
        alert("❌ Không tìm thấy sinh viên!");
      }

      // 4. Xóa sinh viên
      function deleteStudent() {
        var id = prompt("🗑️ Nhập mã sinh viên cần xóa:");
        if (!id) return;

        for (var i = 0; i < students.length; i++) {
          if (students[i].id === id) {
            var confirm = window.confirm(
              "Bạn có chắc chắn muốn xóa sinh viên " + students[i].name + "?"
            );
            if (confirm) {
              students.splice(i, 1);
              alert("✅ Đã xóa sinh viên thành công!");
              showStudents(); // Cập nhật lại bảng
            }
            return;
          }
        }
        alert("❌ Không tìm thấy sinh viên!");
      }

      // 5. Sắp xếp theo điểm
      function sortByScore() {
        if (students.length === 0) {
          alert("📋 Chưa có sinh viên nào để sắp xếp!");
          return;
        }

        for (var i = 0; i < students.length - 1; i++) {
          for (var j = i + 1; j < students.length; j++) {
            if (students[i].score < students[j].score) {
              var temp = students[i];
              students[i] = students[j];
              students[j] = temp;
            }
          }
        }
        showStudents();
      }

      // 6. Kiểm tra điểm
      function checkScore() {
        var id = prompt("✅ Nhập mã sinh viên:");
        if (!id) return;

        for (var i = 0; i < students.length; i++) {
          if (students[i].id === id) {
            alert(
              "📊 Điểm của sinh viên " +
                students[i].name +
                " là: " +
                students[i].score
            );
            return;
          }
        }
        alert("❌ Không tìm thấy sinh viên!");
      }

      // 7. Kiểm tra học lực
      function checkRank() {
        var id = prompt("🎓 Nhập mã sinh viên:");
        if (!id) return;

        for (var i = 0; i < students.length; i++) {
          if (students[i].id === id) {
            alert(
              "🎓 Học lực của sinh viên " +
                students[i].name +
                " là: " +
                students[i].rank()
            );
            return;
          }
        }
        alert("❌ Không tìm thấy sinh viên!");
      }

      // 8. Thoát
      function exitProgram() {
        var confirm = window.confirm(
          "Bạn có chắc chắn muốn thoát chương trình?"
        );
        if (confirm) {
          document.body.innerHTML =
            "<div class='exit-message'>👋 Hẹn gặp lại!<br>Chương trình đã kết thúc.</div>";
        }
      }
    </script>
  </body>
</html>
